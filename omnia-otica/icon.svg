<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#9b7fe8"/>
      <stop offset="50%"  stop-color="#5b9cf6"/>
      <stop offset="100%" stop-color="#3dd6c8"/>
    </linearGradient>
  </defs>
  <!-- fundo arredondado -->
  <rect width="512" height="512" rx="112" fill="#0f1624"/>
  <!-- anel da lente externo -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#g)" stroke-width="28"/>
  <!-- anel interno (foco) -->
  <circle cx="256" cy="256" r="96" fill="none" stroke="url(#g)" stroke-width="14" opacity=".55"/>
  <!-- ponto de foco central -->
  <circle cx="256" cy="256" r="22" fill="url(#g)"/>
  <!-- reflexo da lente -->
  <circle cx="198" cy="198" r="18" fill="white" opacity=".12"/>
</svg>
