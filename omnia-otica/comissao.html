<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>OMNIA Ótica — Comissão</title><meta name="theme-color" content="#eef1f6"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/omnia.css"/>
</head>
<body data-theme="refracao">
<header id="appHeader"></header>
<main class="wrap">
  <div id="loading" class="loadWrap"><div class="spinner"></div><div>Carregando comissão…</div></div>
  <div id="appBody" style="display:none;padding-top:16px">
    <div class="grid">
      <div class="card">
        <div class="cardHead"><div><span class="eyebrow">Simulador</span><h2>Comissão</h2></div></div>
        <div class="cardBody">
          <div class="frow">
            <div class="field"><label>Consultor</label><select id="simSeller"></select></div>
            <div class="field"><label>Quanto pretende vender no mês (R$)</label><input id="simVenda" class="mono" inputmode="decimal" placeholder="40.000,00"/></div>
          </div>
          <div id="simMetaInfo" class="hint" style="margin-top:10px"></div>
          <button class="btn primary" id="btnSimular" style="margin-top:12px"><span>Simular</span></button>
          <div id="simResultado"></div>
        </div>
      </div>
      <div class="card">
        <div class="cardHead"><div><span class="eyebrow">Regras (gestor)</span><h2>Faixas</h2></div>
          <button class="btn go sm" id="btnSaveFaixas">Salvar faixas</button></div>
        <div class="cardBody">
          <div class="hint" style="margin-bottom:10px">Por faixa de atingimento da meta (%), quanto o consultor ganha sobre o que vender.</div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-bottom:6px">
            <span class="tiny">De (%)</span><span class="tiny">Até (%)</span><span class="tiny">Comissão (%)</span><span></span></div>
          <div id="faixasBox"></div>
          <button class="btn ghost sm" id="btnAddFaixa" style="margin-top:6px">+ Adicionar faixa</button>
        </div>
      </div>
    </div>
  </div>
</main>
<script type="module" src="js/app-comissao.js"></script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");</script></body>
</html>
