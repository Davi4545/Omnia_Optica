<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>OMNIA Ótica — Catálogo</title><meta name="theme-color" content="#eef1f6"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/omnia.css"/>
</head>
<body data-theme="refracao">
<header id="appHeader"></header>
<main class="wrap">
  <div id="loading" class="loadWrap"><div class="spinner"></div><div>Carregando catálogo…</div></div>
  <div id="appBody" style="display:none;padding-top:16px">
    <div class="cardHead" style="margin-bottom:14px">
      <div><span class="eyebrow">Produtos da ótica</span><h2>Catálogo</h2></div>
      <div class="rowRight">
        <button class="btn ghost sm" id="btnCarrinho" style="position:relative">
          🛒 Carrinho <span id="cartBadge" class="cartBadge" style="display:none">0</span>
        </button>
        <button class="btn primary" id="btnNovoProd"><span>+ Produto</span></button>
      </div>
    </div>
    <div class="tools" style="margin-bottom:16px;gap:10px">
      <input class="search" id="prodSearch" placeholder="Buscar produto…" style="flex:1"/>
      <select id="prodCat" style="padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-family:inherit;font-size:14px"></select>
    </div>
    <div id="prodGrid" class="prodGrid"></div>
  </div>
</main>

<!-- MODAL: produto -->
<div class="modalBack" id="prodBack">
  <div class="modal">
    <div class="modalHead"><h3 id="prodTitle">Novo produto</h3><button class="btn ghost icon" data-close="prodBack">✕</button></div>
    <div class="modalBody">
      <input type="hidden" id="prod_id"/>
      <div class="frow">
        <div class="field" style="flex:2"><label>Nome do produto</label><input id="prod_nome" placeholder="Ex: Ray-Ban RB5154 Preto"/></div>
        <div class="field"><label>Categoria</label><select id="prod_cat"></select></div>
      </div>
      <div class="frow">
        <div class="field"><label>Preço (R$)</label><input id="prod_preco" class="mono" inputmode="decimal" placeholder="0,00"/></div>
        <div class="field"><label>Estoque</label><input id="prod_estoque" inputmode="numeric" placeholder="0"/></div>
      </div>
      <div class="field full"><label>Descrição</label><input id="prod_desc" placeholder="Material, detalhes, indicação…"/></div>
      <div class="field full"><label>Foto (opcional)</label><input id="prod_foto_inp" type="file" accept="image/*"/>
        <img id="prod_foto_prev" class="fotoPrev" alt="" style="display:none"/></div>
      <label class="chk"><input type="checkbox" id="prod_ativo" checked/> Produto ativo (visível no catálogo)</label>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px">
        <button class="btn stop sm" id="btnDeleteProd" style="margin-right:auto;display:none">Excluir</button>
        <button class="btn ghost sm" data-close="prodBack">Cancelar</button>
        <button class="btn primary sm" id="btnSaveProd"><span>Salvar</span></button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: carrinho -->
<div class="modalBack" id="cartBack">
  <div class="modal">
    <div class="modalHead"><h3>Carrinho</h3><button class="btn ghost icon" data-close="cartBack">✕</button></div>
    <div class="modalBody">
      <div class="field"><label>Nome do cliente</label><input id="cart_cli" placeholder="Para quem é este pedido?"/></div>
      <div class="field"><label>Telefone (WhatsApp)</label><input id="cart_tel" inputmode="tel" placeholder="(00) 00000-0000"/></div>
      <div id="cartItems" style="margin:14px 0"></div>
      <div id="cartTotal" style="font-weight:700;font-size:16px;text-align:right;margin-bottom:10px"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn ghost sm" id="btnLimparCart">Limpar</button>
        <button class="btn wa" id="btnEnviarWa">📲 Enviar pelo WhatsApp</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="js/app-catalogo.js"></script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");</script></body>
</html>
