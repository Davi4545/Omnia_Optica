<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>OMNIA Ótica — Atendimento</title>
<meta name="theme-color" content="#eef1f6"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/omnia.css"/>
</head>
<body data-theme="refracao">
<header id="appHeader"></header>
<main class="wrap">
  <div id="loading" class="loadWrap"><div class="spinner"></div><div>Carregando sua ótica…</div></div>

  <div id="appBody" style="display:none">
    <div class="tabs" id="subtabs" role="tablist" style="margin:16px 0 18px">
      <button class="tab active" data-sub="ops">Atendimento</button>
      <button class="tab" data-sub="metas">Metas</button>
      <button class="tab" data-sub="ranking">Ranking</button>
      <button class="tab" data-sub="conquistas">Conquistas</button>
      <button class="tab" data-sub="dados">Registros</button>
    </div>

    <section id="subOps">
      <div class="kpis" id="kpisTop" style="margin-bottom:18px"></div>
      <div class="grid">
        <div class="card">
          <div class="cardHead">
            <div><span class="eyebrow">Fila de consultores</span><h2>Lista da vez</h2></div>
            <div class="rowRight">
              <button class="btn ghost sm" id="btnAddSeller">+ Consultor</button>
              <button class="btn primary" id="btnCallNext"><span>Chamar próximo</span></button>
            </div>
          </div>
          <div class="cardBody">
            <div class="list" id="filaList"></div>
            <div class="divider"></div>
            <span class="tiny">Fora da fila — toque para voltar</span>
            <div class="list" id="foraList" style="margin-top:9px"></div>
          </div>
        </div>
        <div class="card">
          <div class="cardHead"><div><span class="eyebrow">Em foco</span><h2>Atendendo agora</h2></div><span class="tag" id="focoTag">Ninguém</span></div>
          <div class="cardBody"><div id="focoPanel"></div></div>
        </div>
      </div>
    </section>

    <section id="subMetas" style="display:none">
      <div class="card">
        <div class="cardHead">
          <div><span class="eyebrow">Mês corrente</span><h2>Meta da ótica</h2></div>
          <div class="rowRight">
            <div class="field" style="min-width:170px"><input id="metaInput" class="mono" inputmode="decimal" placeholder="Ex: 180.000,00"/></div>
            <button class="btn go sm" id="btnSaveMeta">Salvar</button>
          </div>
        </div>
        <div class="cardBody" id="metasBody"></div>
      </div>
    </section>

    <section id="subRanking" style="display:none">
      <div class="card"><div class="cardHead"><div><span class="eyebrow">Hoje</span><h2>Ranking do dia</h2></div></div>
        <div class="cardBody" id="rankBody"></div></div>
    </section>

    <section id="subConquistas" style="display:none">
      <div class="card">
        <div class="cardHead"><div><span class="eyebrow">Arena · mês</span><h2>Conquistas</h2></div>
          <div class="field" style="min-width:200px"><select id="seloSeller"></select></div></div>
        <div class="cardBody">
          <div class="kpis" id="seloKpis" style="margin-bottom:16px"></div>
          <div class="seloGrid" id="seloGrid"></div>
          <div class="divider"></div><div id="seloRank"></div>
        </div>
      </div>
    </section>

    <section id="subDados" style="display:none">
      <div class="card"><div class="cardHead"><div><span class="eyebrow">Auditoria</span><h2>Registros do dia</h2></div>
        <button class="btn ghost sm" id="btnExport">Exportar CSV</button></div>
        <div class="cardBody" id="dadosBody"></div></div>
    </section>
  </div>
</main>

<!-- MODAL: consultor -->
<div class="modalBack" id="sellerBack">
  <div class="modal">
    <div class="modalHead"><h3 id="sellerModalTitle">Novo consultor</h3><button class="btn ghost icon" data-close="sellerBack">✕</button></div>
    <div class="modalBody">
      <input type="hidden" id="sellerEditId"/>
      <div class="field"><label>Nome</label><input id="sellerName" placeholder="Ex: Camila Andrade"/></div>
      <div class="field"><label>Foto (opcional)</label><input id="sellerPhoto" type="file" accept="image/*"/>
        <img class="fotoPrev" id="sellerPhotoPrev" alt=""/><span class="hint">A imagem é reduzida automaticamente.</span></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:4px">
        <button class="btn stop sm" id="btnDeleteSeller" style="margin-right:auto;display:none">Remover</button>
        <button class="btn ghost sm" data-close="sellerBack">Cancelar</button>
        <button class="btn primary sm" id="btnSaveSeller"><span>Salvar</span></button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="js/app-ops.js"></script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");</script></body>
</html>
