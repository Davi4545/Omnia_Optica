<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>OMNIA Ótica — Ponto</title><meta name="theme-color" content="#eef1f6"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/omnia.css"/>
</head>
<body data-theme="refracao">
<header id="appHeader"></header>
<main class="wrap">
  <div id="loading" class="loadWrap"><div class="spinner"></div><div>Carregando ponto…</div></div>
  <div id="appBody" style="display:none;padding-top:16px">
    <div class="card">
      <div class="cardHead"><div><span class="eyebrow">Ponto eletrônico · <span id="pontoHoje" class="mono"></span></span><h2>Registrar ponto</h2></div></div>
      <div class="cardBody">
        <div class="field" style="max-width:280px"><label>Quem está registrando</label><select id="pontoSel"></select></div>
        <div class="pontoBtns">
          <button class="btn" data-ponto="entrada"><span class="ph">🟢</span>Entrada</button>
          <button class="btn" data-ponto="intervalo"><span class="ph">☕</span>Intervalo</button>
          <button class="btn" data-ponto="retorno"><span class="ph">🔄</span>Retorno</button>
          <button class="btn" data-ponto="saida"><span class="ph">🔴</span>Saída</button>
        </div>
        <div class="divider"></div>
        <div id="pontoTable"></div>
      </div>
    </div>
  </div>
</main>
<script type="module" src="js/app-ponto.js"></script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");</script></body>
</html>
