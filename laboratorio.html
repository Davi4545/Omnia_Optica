<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>OMNIA Ótica — Laboratório</title>
<meta name="theme-color" content="#eef1f6"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/omnia.css"/>
</head>
<body data-theme="refracao">
<header id="appHeader"></header>
<main class="wrap">
  <div id="loading" class="loadWrap"><div class="spinner"></div><div>Carregando o laboratório…</div></div>
  <div id="appBody" style="display:none;padding-top:16px">
    <div class="labTop">
      <div class="tit">
        <h2>Laboratório</h2>
        <div class="sub" id="labSub">Acompanhe cada óculos até a entrega</div>
      </div>
      <div class="acts">
        <button class="btn ghost sm" id="btnFiltroAtraso" title="Mostrar apenas as atrasadas">⚠ Atrasadas</button>
        <button class="btn primary" id="btnNovaOS"><span>+ Nova OS</span></button>
      </div>
    </div>
    <div class="labResumo" id="labKpis"></div>
    <div class="kanban" id="kanban"></div>
    <div id="labVazio" style="display:none"></div>
  </div>
</main>

<!-- MODAL: OS -->
<div class="modalBack" id="osBack">
  <div class="modal wide">
    <div class="modalHead"><h3 id="osTitle">Nova OS de laboratório</h3><button class="btn ghost icon" data-close="osBack">✕</button></div>
    <div class="modalBody">
      <input type="hidden" id="os_id"/>
      <div class="frow">
        <div class="field"><label>Cliente</label><input id="os_cli" placeholder="Nome do cliente"/></div>
        <div class="field"><label>Telefone</label><input id="os_tel" inputmode="tel" placeholder="(00) 00000-0000"/></div>
      </div>
      <div class="field"><label>Consultor responsável</label><select id="os_seller"></select></div>

      <div class="sectionLabel">Receita</div>
      <table class="rxTable"><thead><tr><th></th><th>Esférico</th><th>Cilíndrico</th><th>Eixo</th><th>DNP</th><th>Adição</th><th>Altura</th></tr></thead>
        <tbody>
          <tr><td>OD</td>
            <td><input id="rx_od_esf" inputmode="decimal" placeholder="0,00"/></td><td><input id="rx_od_cil" inputmode="decimal" placeholder="0,00"/></td>
            <td><input id="rx_od_eixo" inputmode="numeric" placeholder="0°"/></td><td><input id="rx_od_dnp" inputmode="decimal" placeholder="mm"/></td>
            <td><input id="rx_od_add" inputmode="decimal" placeholder="0,00"/></td><td><input id="rx_od_alt" inputmode="decimal" placeholder="mm"/></td></tr>
          <tr><td>OE</td>
            <td><input id="rx_oe_esf" inputmode="decimal" placeholder="0,00"/></td><td><input id="rx_oe_cil" inputmode="decimal" placeholder="0,00"/></td>
            <td><input id="rx_oe_eixo" inputmode="numeric" placeholder="0°"/></td><td><input id="rx_oe_dnp" inputmode="decimal" placeholder="mm"/></td>
            <td><input id="rx_oe_add" inputmode="decimal" placeholder="0,00"/></td><td><input id="rx_oe_alt" inputmode="decimal" placeholder="mm"/></td></tr>
        </tbody></table>
      <div class="rxNote">Esférico/cilíndrico em dioptrias (use − para negativo). Adição e altura só para multifocal/bifocal.</div>
      <div class="frow3" style="margin-top:8px">
        <div class="field"><label>Médico / optometrista</label><input id="os_medico" placeholder="Dr(a)."/></div>
        <div class="field" style="max-width:120px"><label>CRM/CRO</label><input id="os_cro" placeholder="—"/></div>
        <div class="field" style="max-width:150px"><label>Data da receita</label><input id="os_dataRx" type="date"/></div>
      </div>

      <div class="sectionLabel">Armação</div>
      <div class="frow">
        <div class="field" style="max-width:140px"><label>Origem</label><select id="os_arm_origem"><option value="loja">Da loja</option><option value="propria">Do cliente</option></select></div>
        <div class="field"><label>Modelo / referência</label><input id="os_arm_modelo" placeholder="Ex: RB5154"/></div>
        <div class="field" style="max-width:130px"><label>Cor</label><input id="os_arm_cor" placeholder="Ex: preto"/></div>
      </div>
      <div class="frow3">
        <div class="field"><label>Aro (mm)</label><input id="os_arm_aro" inputmode="numeric" placeholder="52"/></div>
        <div class="field"><label>Ponte (mm)</label><input id="os_arm_ponte" inputmode="numeric" placeholder="18"/></div>
        <div class="field"><label>Haste (mm)</label><input id="os_arm_haste" inputmode="numeric" placeholder="140"/></div>
      </div>

      <div class="sectionLabel">Lente</div>
      <div class="frow">
        <div class="field"><label>Tipo</label><select id="os_lente_tipo"></select></div>
        <div class="field"><label>Material</label><select id="os_lente_mat"></select></div>
      </div>
      <div class="field"><label>Tratamentos</label><div class="chips" id="os_trat"></div></div>
      <div class="frow">
        <div class="field"><label>Marca / fornecedor</label><input id="os_lente_marca" placeholder="Ex: Essilor, Zeiss…"/></div>
        <div class="field"><label>Laboratório</label><input id="os_lab" list="labList" placeholder="Onde será produzida"/><datalist id="labList"></datalist></div>
      </div>

      <div class="sectionLabel">Valores e prazos</div>
      <div class="frow3">
        <div class="field"><label>Armação (R$)</label><input id="os_v_arm" class="mono" inputmode="decimal" placeholder="0,00"/></div>
        <div class="field"><label>Lente (R$)</label><input id="os_v_lente" class="mono" inputmode="decimal" placeholder="0,00"/></div>
        <div class="field"><label>Total</label><input id="os_v_total" class="mono" readonly/></div>
      </div>
      <div class="frow3">
        <div class="field"><label>Sinal pago (R$)</label><input id="os_v_sinal" class="mono" inputmode="decimal" placeholder="0,00"/></div>
        <div class="field"><label>Saldo</label><input id="os_v_saldo" class="mono" readonly/></div>
        <div class="field"><label>Previsão de entrega</label><input id="os_prev" type="date"/></div>
      </div>
      <div class="frow">
        <div class="field" id="os_statusWrap" style="display:none"><label>Status</label><select id="os_status"></select></div>
        <div class="field"><label>Observação</label><input id="os_obs" placeholder="Opcional"/></div>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px">
        <button class="btn stop sm" id="btnDeleteOS" style="margin-right:auto;display:none">Excluir OS</button>
        <button class="btn ghost sm" data-close="osBack">Cancelar</button>
        <button class="btn primary sm" id="btnSaveOS"><span>Salvar OS</span></button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="js/app-lab.js"></script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");</script></body>
</html>
